<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentación - Tercer Corte</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <h1>Documentación - Tercer Corte</h1>

  <header class="header">
    <img src="/documentos de arcdata/logo-Arcangeles.png" alt="Logo Fundación" class="logo">
  </header>

  <div class="session">
    <h2>Documentación</h2>
    <div class="upload-container">
      <div class="preview-container">
        <div class="preview-item">
          <iframe src="/documentos de arcdata/informe.pdf"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="session">
    <h2>Diagrama de clases UML </h2>
    <div class="upload-container">
      <div class="preview-container">
        <div class="preview-item">
          <img src="/documentos de arcdata/tallerclases.jpg" alt="Imagen sesión 2">
        </div>
      </div>
    </div>
  </div>

  <div class="session">
    <h2>Documento IEEE</h2>
    <div class="upload-container">
      <div class="preview-container">
        <div class="preview-item">
          <iframe src="/documentos de arcdata/IEEE ArcData.pdf"></iframe>
        </div>
      </div>
    </div>
  </div>

  <div class="session">
    <h2>Mokups de Inicio de Sesión</h2>
    <div class="upload-container">
      <div class="preview-container">
        <div class="preview-item">
          <img src="/documentos de arcdata/Imagen de WhatsApp 2025-05-02 a las 14.01.57_bfc11d83.jpg" alt="Imagen sesión 4">
        </div>
      </div>
    </div>
  </div>

  <div class="session">
    <h2>Project Arcdata</h2>
    <div class="upload-container">
      <div class="preview-container">
        <div class="preview-item">
          <iframe src="/documentos de arcdata/ArcData.project.pdf"></iframe>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
